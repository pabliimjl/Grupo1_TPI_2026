<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuxeMotor Care</title>
    <link rel="stylesheet" href="../../css/styles.css">
    <link rel="stylesheet" href="../../css/templateStyles.css">
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
</head>
<body>
    <div id="headerDiv"></div>
    <div id="containerDiv">
        <button id="ingresarButton" class="btn btn-primary">Ingresar</button>
    </div>
</body>
<script>
    document.getElementById('ingresarButton').addEventListener('click', function() {
        console.log("Ingresar clicked");
        window.location.href = 'html/cliente/bienvenida.html';
    });
    document.getElementById('ingresarButton').addEventListener('contextmenu', function() {
        console.log("Ingresar right-clicked");
        event.preventDefault();
        window.location.href = 'html/admin/login.html';
    });
    const headerDiv = document.getElementById("headerDiv")
    
    fetch("../../html/template/header.html")
    .then(response => response.text())
    .then(data => {
        headerDiv.innerHTML = data;
    });
</script>
</html>
