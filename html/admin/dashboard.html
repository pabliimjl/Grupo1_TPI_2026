<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lubricentro</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../../css/styles.css">
    <link rel="stylesheet" href="../../css/dashboard.css">
    <link rel="stylesheet" href="../../css/templateStyles.css">
</head>
<body>
    <div id="headerDiv"></div>
    <div id="containerDiv">
        <h2>Bienvenido al panel de administración</h2>
        <p>Desde aquí puedes gestionar los productos.</p>
        <div id="productos">
            <div class="tabs">
                <button class="tab-button active" data-tab="tablaLubricantes">Lubricantes</button>
                <button class="tab-button" data-tab="tablaEsteticaVehicular">Estética Vehicular</button>
            </div>
            <div id="tablaLubricantes" class="tab-content active">
                <table>
                    <thead>
                        <tr>
                            <th>Producto</th>
                            <th>Marca</th>
                            <th>Tipo</th>
                            <th>Densidad</th>
                            <th>Formato</th>
                            <th>Precio</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
            <div id="tablaEsteticaVehicular" class="tab-content">
                <table>
                    <thead>
                        <tr>
                            <th>Producto</th>
                            <th>Categoria</th>
                            <th>Formato</th>
                            <th>Precio</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>
    <footer id="footer">
        <a href="./login.html"><img src="../../resources/icons/arrow_back_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.svg"/></a>
        <p></p>
        <button id="cargarProductoButton" class="btn btn-primary">Cargar Producto</button>
    </footer>
</body>
<script type="module" src="../../js/admin/adminDashboard.js"></script>
</html>
